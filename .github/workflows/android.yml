name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Сборка APK, тесты, lint и проверка дизайн-токенов
        run: ./gradlew assembleDebug check --stacktrace

      - name: Скриншоты экранов
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: APK для установки на телефон
        uses: actions/upload-artifact@v6
        with:
          name: simple-tasks-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Скриншоты
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: app/screenshots/*.png

      - name: Отчёты (при ошибке)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
