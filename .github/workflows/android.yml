name: Android CI

on:
  # main собирается при push, остальные ветки — через pull request или вручную (workflow_dispatch).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          # Полная история: номер сборки (versionCode) = число коммитов.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Сборка APK
        run: ./gradlew assembleDebug --stacktrace

      - name: APK для установки на телефон
        uses: actions/upload-artifact@v6
        with:
          name: simple-tasks-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Обновление по кнопке (итерация 10): после мержа в main APK уходит релизом в публичный репозиторий
      # prostovasei/simple-tasks-releases (только файлы, без кода). Нужен секрет RELEASES_TOKEN — без него шаг пропускается.
      - name: Опубликовать APK для обновления в приложении
        # Сразу после сборки, до тестов (итерация 12): этот же код уже прошёл все проверки в PR, а тесты ниже
        # всё равно идут — упавшие на main видны в Actions.
        # Также вручную (Actions → Android CI → Run workflow на main) — опубликовать текущую сборку повторно.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Секрет RELEASES_TOKEN не задан — APK не опубликован"; exit 0; fi
          BUILD=$(git rev-list --count HEAD)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK="simple-tasks-$NAME-build$BUILD.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "build-$BUILD" --repo prostovasei/simple-tasks-releases >/dev/null 2>&1; then echo "Сборка $BUILD уже опубликована"; exit 0; fi
          gh release create "build-$BUILD" "$APK" --repo prostovasei/simple-tasks-releases \
            --title "$NAME (сборка $BUILD)" --notes "Simple Tasks $NAME, сборка $BUILD" --latest

      - name: Тесты, lint и проверка дизайн-токенов
        run: ./gradlew check --stacktrace

      - name: Скриншоты экранов
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Скриншоты
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: app/screenshots/*.png

      - name: Отчёты (при ошибке)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
