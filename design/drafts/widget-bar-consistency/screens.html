<!doctype html>

<div class="demo-controls">

dden="true"><path d="M12 5v14 M5 12h14" vector-effect="non-scaling-stroke"/></svg></span></button><button class="gap left" aria-label="Открыть приложение, левый промежуток"></button><div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-module="tasks" aria-label="Задачи"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4,5h16v14H4z M9.3,5v14 M14.7,5v14" vector-effect="non-scaling-stroke"/></svg></button><button class="tab" role="tab" aria-selected="false" data-module="finance" aria-label="Финансы"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9,20V4h4.5a4,4 0,0 1,0 8H6.5 M6.5,16H15" vector-effect="non-scaling-stroke"/></svg></button><button class="tab" role="tab" aria-selected="false" data-module="health" aria-label="Здоровье"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,20c0,0 -7,-4.4 -7,-10a4,4 0,0 1,7 -2.6A4,4 0,0 1,19 10c0,5.6 -7,10 -7,10z" vector-effect="non-scaling-stroke"/></svg></button></div><button class="gap right" aria-label="Открыть приложение, правый промежуток"></button><button class="date" aria-label="Вернуться к сегодня, 21 ноября"><b class="date-number">21</b><span class="date-caption"><span>СБ</span><span>ноя</span></span></button><button class="refresh" aria-label="Обновление"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,4v10M8,10l4,4 4,-4M5,19h14" vector-effect="non-scaling-stroke"/></svg></button></div></div><output aria-live="polite"></output></section><section class="choice"><h2>3. Общая подложка</h2><p>Одна светлая подложка под тремя вкладками, интервал 32 dp</p><div class="widget variant-c"><div class="bar" aria-label="Панель виджета"><button class="add" aria-label="Добавить"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14" vector-effect="non-scaling-stroke"/></svg></span></button><button class="gap left" aria-label="Открыть приложение, левый промежуток"></button><div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="
