<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Tasks — макеты новостей</title>
<style>
  :root { color-scheme: light; --text: #16171d; --muted: #5c5e67; --inactive: #777a84; --line: #e9e9ed; --surface: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2f3f6; color: var(--text); font: 14px Arial, sans-serif; }
  main { width: fit-content; max-width: 100%; margin: 0 auto; padding: 33px 30px; }
  h1 { font-size: 28px; margin: 0 0 22px; letter-spacing: -.55px; }
  .layouts { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  .samples { display: grid; gap: 20px; }
  .sizes { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { color: var(--muted); margin: 0 0 8px; font-size: 13px; font-weight: 700; }
  .screen { width: var(--width); height: var(--height); display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border-radius: 22px; box-shadow: 0 1px 2px #15172512, 0 6px 22px #1517250c, 0 0 0 1px #dedfe4; }
  .app { --width: 360px; --height: 694px; }
  .wide { --width: 392px; --height: 316px; }
  .medium { --width: 320px; --height: 236px; }
  .tiny { --width: 180px; --height: 110px; border-radius: 16px; }
  .status { display: flex; justify-content: space-between; padding: 12px 17px 7px; font-size: 12px; font-weight: 700; }
  .status-symbols { display: flex; align-items: center; gap: 4px; }
  .signal { width: 10px; height: 8px; background: var(--text); clip-path: polygon(0 100%,100% 0,100% 100%); }
  .battery { width: 13px; height: 7px; border: 1px solid var(--text); border-radius: 2px; position: relative; }
  .battery::before { content: ''; position: absolute; inset: 1px 2px 1px 1px; background: var(--text); }
  header { padding: 14px 14px 8px; }
  .app header { padding: 12px 16px 10px; }
  .heading { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  .heading h2 { margin: 0; font-size: 16px; }
  .app h2 { font-size: 22px; }
  .source, .updated { color: var(--muted); font-size: 11px; }
  .app .source { margin-top: 4px; font-size: 12px; }
  .tiny header { display: none; }
  .feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 0 14px; }
  .app .feed { padding: 0 16px; }
  .tiny .feed { padding: 3px 8px 0; }
  .day { margin: 7px 0 0; padding: 0 0 2px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .app .day { margin-top: 8px; font-size: 12px; }
  .tiny .day { display: none; }
  .item { display: block; color: inherit; text-decoration: none; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .item:focus-visible, button:focus-visible { outline: 2px solid #6448b6; outline-offset: -2px; }
  .app .item { padding: 11px 0; }
  .tiny .item { padding: 4px 0; }
  .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-bottom: 3px; }
  .app .meta { font-size: 12px; margin-bottom: 4px; }
  .tiny .meta { font-size: 9px; margin-bottom: 2px; }
  .title { font-size: 13px; line-height: 1.3; font-weight: 600; }
  .app .title { font-size: 15px; line-height: 1.32; }
  .tiny .title { font-size: 11px; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bar { height: 40px; flex: 0 0 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 6px; background: var(--surface); border-top: 1px solid var(--line); }
  .app .bar { height: 44px; flex-basis: 44px; padding: 0 12px; }
  .bar button, .bar .date { border: 0; padding: 0; background: transparent; display: grid; place-items: center; height: 100%; color: inherit; }
  .bar .primary { width: 64px; height: 30px; border-radius: 100px; background: var(--text); color: #fff; }
  .tabs { height: 100%; display: flex; }
  .tabs button { width: 36px; color: var(--inactive); }
  .tabs button.active { color: var(--text); }
  .app .tabs button { width: 48px; }
  .bar-end { height: 100%; justify-self: end; display: flex; align-items: center; }
  .bar-end button { width: 36px; }
  .bar .date { width: 48px; display: flex; justify-content: center; gap: 3px; align-items: center; font-weight: 700; }
  .date strong { font-size: 20px; }
  .date span { font-size: 8px; line-height: 8px; }
  .compact.bar { grid-template-columns: 1fr auto; }
  .tiny .bar .primary { width: 44px; height: 28px; }
  .tiny .tabs button { width: 31px; }
  .icon { width: 24px; height: 24px; display: block; background: currentColor; mask-size: contain; mask-position: center; mask-repeat: no-repeat; }
  .app .primary .icon { width: 24px; height: 24px; }
  .gesture { flex: 0 0 20px; display: grid; place-items: center; }
  .gesture::before { content: ''; width: 102px; height: 4px; border-radius: 8px; background: var(--text); }
  @media (max-width: 560px) { main { padding: 24px 10px; } .layouts { gap: 24px; } }
</style>

  const tabs = `<nav class="tabs" aria-label="Модули">${attributes.map(([name, label]) => action(name, label, name === 'news' ? 'class="active" aria-current="page"' : '')).join('')}</nav>`;
  const compact = `<div class="bar compact">${action('refresh', 'Обновить новости', 'class="primary"')}${tabs}</div>`;
  const dates = '<span class="date" aria-label="21 ноября, суббота"><strong>21</strong><span>СБ<br>ноя</span></span>';
  const appEnd = action('settings', 'Настройки');
  const wideEnd = dates + action('update', 'Проверить обновление приложения');
  const bar = end => `<div class="bar">${action('refresh', 'Обновить новости', 'class="primary"')}${tabs}<div class="bar-end">${end}</div></div>`;
  const feed = `<section class="feed" aria-label="Новости за 24 часа" tabindex="0">${records.map(([day, time, sport, title], i) => `${day !== records[i - 1]?.[0] ? `<h3 class="day">${day}</h3>` : ''}<div class="item"><div class="meta">${time} · ${sport}</div><div class="title">${title}</div></div>`).join('')}</section>`;
  const header = app => app ? '<header><div class="heading"><h2>Новости</h2></div><div class="source">Sports.ru · последние 24 часа</div></header>' : '<header><div class="heading"><h2>Новости</h2><span class="updated">Обновлено в 22:34</span></div></header>';
  const status = '<div class="status" aria-hidden="true"><span>22:34</span><span class="status-symbols"><i class="signal"></i><i class="battery"></i></span></div>';
  const panel = (label, size, contents) => `<figure><figcaption>${label}</figcaption><div class="screen ${size}">${contents}</div></figure>`;
  document.querySelector('#layouts').innerHTML = panel('Приложение · 360 dp', 'app', status + header(true) + feed + bar(appEnd) + '<div class="gesture" aria-hidden="true"></div>') + `<div class="samples">${panel('Широкий виджет · 392 dp', 'wide', header(false) + feed + bar(wideEnd))}<div class="sizes">${panel('Виджет · 320 dp', 'medium', header(false) + feed + compact)}${panel('Минимум · 180 × 110 dp', 'tiny', feed + compact)}</div></div>`;
</script>
</html>
