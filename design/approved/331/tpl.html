<title>Отступы у кружка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap">
<style>
/* три телефона рядом: один и тот же список «Предстоящее» с разным отступом у кружка */
:root{--bg:#eef0f3;--card:#fff;--fg:#1b1d22;--muted:#8a8f98;--line:#e3e5e9;--late:#c62828;--pri:#6a3fb5;--font:Manrope,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121317;--card:#1c1e23;--fg:#eceef2;--muted:#8b9099;--line:#33363d;--late:#ef6b6b;--pri:#b18cf0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121317;--card:#1c1e23;--fg:#eceef2;--muted:#8b9099;--line:#33363d;--late:#ef6b6b;--pri:#b18cf0;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
h1{font-size:20px;margin:0 0 4px}.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.grid{display:flex;flex-wrap:wrap;gap:20px}section{flex:1 1 340px;min-width:0;max-width:412px}
h2{font-size:16px;margin:0}section p{color:var(--muted);margin:2px 0 10px}
.phone{background:var(--card);border-radius:24px;padding:14px 14px 18px}
.day{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:15px}.day b{font-weight:700}.day .lb{font-size:13px;font-weight:600}
.day.late{color:var(--late)}.bar{flex:1;height:4px;background:var(--line);border-radius:2px}.bar i{display:block;height:100%;background:var(--fg);border-radius:2px}.sp{flex:1}.cnt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;min-height:46px;font-size:16px}
.tm{width:38px;font-size:12px;font-variant-numeric:tabular-nums;line-height:1.3}
.chk{width:20px;height:20px;flex:none;border:2px solid var(--muted);border-radius:50%;box-sizing:border-box;margin:0 var(--g);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.chk.rep{border-style:dotted}.tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ic{width:28px;text-align:center;filter:grayscale(1);opacity:.7}.em{width:28px;text-align:center}
.pri,.pri .chk{color:var(--pri);border-color:var(--pri)}.done{opacity:.4}.done .chk{background:var(--muted);color:var(--card)}
.note{margin-top:20px;color:var(--muted);max-width:70ch}
</style>
<h1>Список «Предстоящее»: отступ у кружка</h1>
<p class="lead">Во всех вариантах нет вертикальной линии и линии «сейчас»; заголовки дней как в виджете — прогресс «1 из 6» у сегодня и счётчик у остальных дней. Одинаково в приложении и виджете.</p>
<div class="grid">%COLS%</div>
<p class="note">Данные со скриншотов PM. Сейчас отступ ≈ 2 dp.</p>
